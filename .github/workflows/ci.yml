name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # Tag the images and the daemon agree on (scripts/build-images.sh and warrend default to "dev").
  WARREN_IMAGE_TAG: dev

jobs:
  fmt-clippy:
    name: fmt and clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test (every crate except warren-e2e)
        run: cargo test --workspace --exclude warren-e2e --locked

  macos:
    name: macOS build (Apple silicon)
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy (every crate, native arm64)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo test (the crates that run on a Mac host)
        run: cargo test --locked -p warren-core -p warren-gateway -p warren-gateway-client -p warren-runtime-mac -p warren-lifecycle -p warren-api -p warren-cli
      - name: Syntax-check the Mac scripts
        run: for f in scripts/mac/*.sh scripts/mac/guest/*.sh; do bash -n "$f"; done; for p in scripts/mac/guest/*.plist; do plutil -lint "$p"; done

  images:
    name: template images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
      - name: Install the musl toolchain for the static gateway
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
          rustup target add x86_64-unknown-linux-musl
      - name: Build the gateway (release, static musl)
        run: CC_x86_64_unknown_linux_musl=musl-gcc cargo build --release --locked -p warren-gateway --target x86_64-unknown-linux-musl
      - name: Prepare the paths scripts/env.sh expects
        # build-images.sh sources scripts/env.sh, which creates /data/tmp; the runner has no /data.
        run: sudo mkdir -p /data/tmp && sudo chmod 1777 /data/tmp
      - name: Build warren/base, warren/agent, warren/opencode and warren/claude
        run: |
          WARREN_GATEWAY_BIN=target/x86_64-unknown-linux-musl/release/warren-gateway scripts/build-images.sh
      - name: Save the images
        run: docker save "warren/base:$WARREN_IMAGE_TAG" "warren/agent:$WARREN_IMAGE_TAG" "warren/opencode:$WARREN_IMAGE_TAG" "warren/claude:$WARREN_IMAGE_TAG" | gzip -1 > warren-images.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: warren-images
          path: warren-images.tar.gz
          retention-days: 1
          compression-level: 0

  e2e:
    name: end-to-end
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
      - uses: actions/download-artifact@v4
        with:
          name: warren-images
      - name: Load the images
        run: |
          docker load < warren-images.tar.gz
          docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep '^warren/'
      - name: Install gVisor (falls back to runc)
        run: |
          if sudo scripts/install-gvisor.sh; then
            echo "gVisor installed; instances run under runsc"
          else
            echo "::warning::gVisor could not be installed on this runner; the e2e suite runs instances under runc"
          fi
      - name: Install the musl toolchain for the static gateway
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
          rustup target add x86_64-unknown-linux-musl
      - name: Build warrend (release) and the static gateway the daemon injects into registered images
        run: |
          cargo build --release --locked -p warrend
          CC_x86_64_unknown_linux_musl=musl-gcc cargo build --release --locked -p warren-gateway --target x86_64-unknown-linux-musl
      - name: Run the end-to-end suite
        env:
          WARREN_BIN: ${{ github.workspace }}/target/release/warrend
          WARREN_GATEWAY_BIN: ${{ github.workspace }}/target/x86_64-unknown-linux-musl/release/warren-gateway
          WARREN_E2E_LOG: info
        run: cargo test --locked -p warren-e2e -- --ignored --test-threads=1 --skip vm_
