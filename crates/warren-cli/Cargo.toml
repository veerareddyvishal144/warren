[package]
name = "warren-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "warren"
path = "src/main.rs"

[dependencies]
warren-core.workspace = true
warren-sdk.workspace = true
tokio.workspace = true
clap.workspace = true
serde_json.workspace = true
anyhow.workspace = true
futures.workspace = true
# `shell` and `run`: the WebSocket to the gateway's PTY and raw-mode terminal handling.
tokio-tungstenite.workspace = true
nix = { workspace = true, features = ["term", "ioctl"] }
# `sync` and `run`: .gitignore-aware walks and tarballs.
ignore.workspace = true
tar.workspace = true
flate2.workspace = true
serde.workspace = true
